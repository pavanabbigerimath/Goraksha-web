{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-lg border-0" style="border-radius: 20px;">
                <div class="card-header bg-success text-white text-center p-4" style="border-radius: 20px 20px 0 0;">
                    <i class="bi bi-shield-lock-fill" style="font-size: 2rem;"></i>
                    <h3 class="fw-bold">Login</h3>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Enter Username" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold p-2" style="border-radius: 10px;">
                            Login Now
                        </button>
                        <a href="{% url 'initiate_profile_password_reset' %}" class="text-decoration-none">Forgot Password?</a>
                    </form>
                </div>
                <div class="card-footer text-center bg-white border-0 pb-4">
                    s<p class="small text-muted">Don't have an account? <a href="{% url 'signup' %}" class="text-success fw-bold">Sign-up</a></p>                
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
