{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <style>
        .form-control:focus {
            border-color: #28a745; /* ಹಸಿರು ಬಾರ್ಡರ್ */
            box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25); /* ಹಸಿರು ಶ್ಯಾಡೋ */
        }
    </style>

    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    <h4 class="fw-bold text-center mb-4 text-success">Reset Password</h4>
                    <p class="text-muted text-center">Manage {{ target_user.username }}'s account security</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.help_text %}
                                    <small class="text-muted">{{ field.help_text }}</small>
                                {% endif %}
                            </div>
                        {% endfor %}
                        
                        <button type="submit" class="btn btn-success w-100 rounded-pill py-2 mt-3 fw-bold">Update Password</button>
                        <a href="javascript:history.back()" class="btn btn-link w-100 mt-2 text-decoration-none">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
