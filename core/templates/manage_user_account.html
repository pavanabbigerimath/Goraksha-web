{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 550px;">
    <div class="card shadow border-0 rounded-3 overflow-hidden">
        <div class="card-header bg-success text-white py-3">
            <h5 class="fw-bold m-0"><i class="bi bi-person-gear"></i> User Account Control</h5>
        </div>
        <div class="card-body p-4">
            <h6 class="text-muted mb-4">Managing Account: <span class="text-dark fw-bold">{{ target_user.username }}</span></h6>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Username</label>
                    {{ form.username }}
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">Phone Number</label>
                    {{ form.phone_number }}
                </div>

                <hr class="text-muted">

                <div class="form-check form-switch mb-3">
                    {{ form.is_active }}
                    <label class="form-check-label fw-bold small ms-2">Active Status (ಖಾತೆ ಸಕ್ರಿಯಗೊಳಿಸಿ)</label>
                </div>

                <div class="form-check form-switch mb-3">
                    {{ form.is_staff }}
                    <label class="form-check-label fw-bold small ms-2">Staff Status (ಸಿಬ್ಬಂದಿ ಅನುಮತಿ)</label>
                </div>

                <div class="form-check form-switch mb-4">
                    {{ form.is_superuser }}
                    <label class="form-check-label fw-bold small ms-2">Superuser Status (ಮುಖ್ಯ ನಿರ್ವಾಹಕರು)</label>
                </div>

                <div class="mt-5 p-3 border-top">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <button type="submit" name="action" value="delete" class="btn btn-outline-danger btn-sm px-3" 
                                    onclick="return confirm('Warning! Are you sure you want to delete your account?');">
                                <i class="bi bi-trash3"></i> Delete
                            </button>
                        </div>

                        <div class="d-flex gap-2">
                            <a href="{% url 'admin_password_reset' target_user.id %}" class="btn btn-outline-warning btn-sm px-3">
                                <i class="bi bi-key"></i> Reset Password
                            </a>
                            <a href="{% url 'admin_dashboard' %}" class="btn btn-light btn-sm px-3">Cancel</a>
                            <button type="submit" class="btn btn-success btn-sm px-4">Save Changes</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
