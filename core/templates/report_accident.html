<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Emergency | Goraksha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .upload-card { max-width: 500px; margin: 50px auto; border-radius: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card shadow-lg upload-card p-4">
        <h3 class="text-center text-danger fw-bold">🚨 Emergency Report</h3>
        <p class="text-center text-muted">Upload photo of the injured animal. We will auto-detect location.</p>
        
        <form method="POST" enctype="multipart/form-data" id="accidentForm">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Select Accident Photo</label>
                <input type="file" name="image" class="form-control" accept="image/*" required>
            </div>

            <input type="hidden" name="latitude" id="latitude">
            <input type="hidden" name="longitude" id="longitude">

            <button type="submit" id="submitBtn" class="btn btn-danger w-100 py-2">
                Send Emergency Alert
            </button>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById('accidentForm');
    const submitBtn = document.getElementById('submitBtn');

    submitBtn.addEventListener('click', function(event) {
        event.preventDefault(); // Stop form from auto-submitting

        // Check for Geolocation
        if (navigator.geolocation) {
            submitBtn.innerText = "Detecting Location...";
            navigator.geolocation.getCurrentPosition(function(position) {
                // Set the hidden values
                document.getElementById('latitude').value = position.coords.latitude;
                document.getElementById('longitude').value = position.coords.longitude;
                
                // Now submit the form
                form.submit();
            }, function(error) {
                alert("We need your location to help the animal. Please allow location access.");
                submitBtn.innerText = "Send Emergency Alert";
            });
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    });
</script>

</body>
</html>
